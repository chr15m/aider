name: Create Release with Standalone Binaries

on:
  push:
    branches:
      - build-standalone
      - chrism-fork

jobs:
  build-and-release:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            asset_suffix: linux
          - os: macos-14
            asset_suffix: macos-x64
          - os: macos-latest
            asset_suffix: macos-arm64
          - os: windows-2022
            asset_suffix: windows

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        if: runner.os != 'macOS' || matrix.asset_suffix == 'macos-arm64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Python (macOS Intel)
        if: matrix.asset_suffix == 'macos-x64'
        uses: gabrielfalcao/pyenv-action@v18
        with:
          default: 3.10.13
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.13'

      - name: Install dependencies
        run: pip install .

      - name: Build binary
        shell: bash
        run: ./scripts/build_standalone.sh

      - name: Rename binary
        shell: bash
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          if [ "${{ matrix.os }}" == "windows-2022" ]; then
            mv dist/aider.exe "dist/${REPO_NAME}-${{ matrix.asset_suffix }}.exe"
          else
            mv dist/aider "dist/${REPO_NAME}-${{ matrix.asset_suffix }}"
          fi

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ github.event.repository.name }}-${{ matrix.asset_suffix }}${{ matrix.os == 'windows-2022' && '.exe' || '' }}
          tag_name: release-${{ github.run_number }}-${{ github.sha }}
          name: Release ${{ github.run_number }}
          body: |
            Automated release of ${{ github.event.repository.name }} binaries.
            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
